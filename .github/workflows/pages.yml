name: Deploy site to GitHub Pages

# Publishes the static site at https://batuaribakir.github.io/peakdeconv-site/.
# There is no build step: the job stages the files the four pages and the
# presentations need into _site/ and uploads only that, so the workbook, the
# Spline design files, the tooling, the READMEs and the retired project/ and
# resources/ pages never reach the public artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The two permissions deploy-pages needs, and nothing else: read the code,
# write a Pages deployment, and mint the OIDC token that authenticates it.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published;
# queued runs collapse so only the newest one follows it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual dispatch can select any branch; only main may produce a Pages artifact.
    if: github.ref == 'refs/heads/main'
    name: Stage and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Stage the publishable files
        run: python3 tools/stage-site.py _site

      # Lists the staged tree, then fails on a missing entry page or asset, a
      # link that resolves to nothing, anything that must stay unpublished, or
      # a site or footer menu that does not list exactly the four pages.
      - name: Validate the staged directory
        run: python3 tools/validate-site.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the staged directory as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
