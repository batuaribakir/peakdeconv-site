<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MAVIS — Multi-Analyte Voltammetric Intelligence System</title>
  <meta name="description" content="MAVIS, the Multi-Analyte Voltammetric Intelligence System: reading overlapping peaks in electrochemical signals." />
  <meta name="theme-color" content="#031011" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <div id="root">
    <div id="runway">
      <div id="viewport">
        <div id="stage">
          <canvas id="dots" aria-hidden="true"></canvas>
          <div id="chartLabels" aria-hidden="true"></div>
          <div class="market-label" aria-hidden="true"></div>
          <div id="opsLabels" aria-hidden="true"></div>

          <div class="brand" aria-label="MAVIS"></div>
          <audio id="bgm" preload="none" loop></audio>
          <button id="bgmBtn" class="pending" type="button" aria-label="Background music" aria-pressed="false"></button>

          <div id="hint" aria-hidden="true"></div>

          <div id="leadSheet" role="dialog" aria-modal="true" aria-labelledby="leadTitle" aria-hidden="true"></div>
        </div>
      </div>
    </div>
